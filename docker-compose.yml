services:

  store-api:
    build: ./api
    container_name: tpstore-api
    environment:
      - EXTERNAL_DISK_PATH=/mnt/external
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth:8000}
    volumes:
      - ${EXTERNAL_DISK_PATH:-/mnt/external}:/mnt/external
      - /mnt:/mnt/server/mnt
      - ./data:/app/data
    networks:
      - gateway
    restart: unless-stopped

  store-frontend:
    build: ./frontend
    container_name: tpstore-frontend
    depends_on:
      - store-api
    networks:
      - gateway
    restart: unless-stopped

  share-frontend:
    build: ./share-frontend
    container_name: tpshare-frontend
    networks:
      - gateway
    restart: unless-stopped

networks:
  gateway:
    external: true
    name: tpcloud_gateway
